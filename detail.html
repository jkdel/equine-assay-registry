<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="A simple WebApp to browse and submit equine assay validation data.">
  <!-- <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/sort@3.15.12/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"></script>
  <title>Equine Assay Registry</title>
</head>

<body>
  <a href="https://www.vetmed.msstate.edu/nfllrc">
    <header id="mhead">
      <div class="logo"></div>
    </header>
  </a>
  <main>
    <!-- <div class="banner">
        </div> -->

  <div x-data="{
            descriptor: '',
            submissions: [
              { id: 1, species: 'equine', target: 'insulin', manufacturer: 'Mercodia', type: 'ELISA', descriptor: 'Mercodia equine insulin ELISA', authors: 'Grob et al.', result: 'sucess' },
              { id: 2, species: 'human', target: 'insulin', manufacturer: 'Siemens', type: 'CLIA', descriptor: 'IMMULITE 2000XPi human insulin CLIA', authors: 'Grob et al.', result: 'sucess' },
              { id: 3, species: 'human', target: 'insulin2', manufacturer: 'Siemens', type: 'CLIA', descriptor: 'IMMULITE 2000XPi human insulin CLIA', authors: 'Grob et al.', result: 'sucess' },
            ],
            init() {
                const urlParams = new URLSearchParams(window.location.search);
                this.descriptor = urlParams.get('descriptor') || '';
            }
        }">
    
    <button onclick="document.referrer ? history.back() : window.location.href = 'index.html';" class="outline" style="margin-bottom: 20px;">< Back</button>
    <article>
      <h2 x-text="descriptor"></h2>
      <template x-for="sub in submissions">
        <div x-show="sub.descriptor === descriptor" class="cardish">
          <h3 x-text="sub.authors"></h3>
          <p x-text="sub.result"></p>
        </div>
      </template>
    </article>
  </div>

  </main>
</body>
</html>
